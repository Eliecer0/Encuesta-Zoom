<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="pageTitle">Administrador - Encuesta Zoom</title>
    <script src="/socket.io/socket.io.js"></script>
    <script src="https://appssdk.zoom.us/sdk.min.js"></script>
    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            color: #1f2937;
        }

        .contenedor {
            width: 100%;
            max-width: 550px;
        }

        .tarjeta {
            position: relative;
            background: white;
            border-radius: 20px;
            padding: 28px;
            box-shadow: 0 8px 30px rgba(0,0,0,.08);
        }

        .cabecera {
            padding-right: 105px;
        }

        h1 {
            margin: 0 0 10px;
            font-size: 27px;
        }

        .subtitulo {
            margin: 0;
            color: #6b7280;
        }

        .idioma {
            position: absolute;
            top: 22px;
            right: 22px;
            border: 1px solid #d1d5db;
            border-radius: 10px;
            padding: 8px 10px;
            background: white;
            color: #1f2937;
            font-size: 14px;
            cursor: pointer;
        }

        .estadisticas {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
            margin: 24px 0;
        }

        .estadistica {
            background: #f3f4f6;
            padding: 18px;
            border-radius: 15px;
            text-align: center;
        }

        .estadistica span {
            display: block;
            color: #6b7280;
            font-size: 14px;
        }

        .estadistica strong {
            display: block;
            font-size: 38px;
            margin-top: 7px;
        }

        .total {
            background: #eef2ff;
            border-radius: 18px;
            padding: 21px;
            text-align: center;
            margin-bottom: 18px;
        }

        .total small {
            display: block;
            color: #6b7280;
        }

        .total strong {
            display: block;
            font-size: 52px;
            margin-top: 3px;
        }

        button.accion {
            width: 100%;
            border: 0;
            border-radius: 12px;
            padding: 15px;
            margin-top: 10px;
            font-size: 17px;
            cursor: pointer;
        }

        #lanzar {
            background: #2d8cff;
            color: white;
        }

        #cerrar {
            background: #ef4444;
            color: white;
        }

        #estado {
            margin-top: 16px;
            padding: 13px;
            border-radius: 12px;
            background: #f3f4f6;
            text-align: center;
            color: #374151;
        }

        @media (max-width: 520px) {
            .estadisticas {
                grid-template-columns: 1fr;
            }

            .cabecera {
                padding-right: 0;
                padding-top: 45px;
            }
        }
    </style>
</head>
<body>

<div class="contenedor">
    <div class="tarjeta">

        <select id="idioma" class="idioma" aria-label="Idioma">
            <option value="es">Español</option>
            <option value="en">English</option>
            <option value="de">Deutsch</option>
            <option value="fr">Français</option>
            <option value="it">Italiano</option>
            <option value="pt">Português</option>
        </select>

        <div class="cabecera">
            <h1 data-i18n="adminTitle">Panel del administrador</h1>
            <p class="subtitulo" data-i18n="adminSubtitle">Control de la encuesta de la reunión.</p>
        </div>

        <div class="estadisticas">
            <div class="estadistica">
                <span data-i18n="responses">Respuestas</span>
                <strong id="respuestas">0</strong>
            </div>
            <div class="estadistica">
                <span data-i18n="physicalPeople">Personas físicas</span>
                <strong id="personas">0</strong>
            </div>
        </div>

        <div class="total">
            <small data-i18n="estimatedTotal">Total estimado de personas</small>
            <strong id="total">0</strong>
        </div>

        <button id="lanzar" class="accion" data-i18n="launch">Lanzar encuesta</button>
        <button id="cerrar" class="accion" data-i18n="close">Cerrar encuesta</button>

        <div id="estado" data-i18n="closed">Encuesta cerrada.</div>
    </div>
</div>

<script>
    const socket = io();
    let zoomDisponible = false;

async function configurarZoom() {
    try {
        await zoomSdk.config({
            version: "0.16",
            capabilities: [
                "getUserContext",
                "getMeetingUUID",
                "startCollaborate",
                "endCollaborate",
                "onCollaborateChange"
            ]
        });

        zoomDisponible = true;
        console.log("Zoom SDK configurado correctamente.");
    } catch (error) {
        console.error("Error configurando Zoom SDK:", error);
    }
}

configurarZoom();
    const respuestas = document.getElementById("respuestas");
    const personas = document.getElementById("personas");
    const total = document.getElementById("total");
    const estado = document.getElementById("estado");
    const lanzar = document.getElementById("lanzar");
    const cerrar = document.getElementById("cerrar");
    const idioma = document.getElementById("idioma");
    const pageTitle = document.getElementById("pageTitle");

    const translations = {
        es: {
            pageTitle: "Administrador - Encuesta Zoom",
            adminTitle: "Panel del administrador",
            adminSubtitle: "Control de la encuesta de la reunión.",
            responses: "Respuestas",
            physicalPeople: "Personas físicas",
            estimatedTotal: "Total estimado de personas",
            launch: "Lanzar encuesta",
            close: "Cerrar encuesta",
            closed: "Encuesta cerrada.",
            active: "Encuesta activa.",
            launched: "Encuesta lanzada. Esperando respuestas..."
        },
        en: {
            pageTitle: "Admin - Zoom Survey",
            adminTitle: "Administrator Panel",
            adminSubtitle: "Control the meeting survey.",
            responses: "Responses",
            physicalPeople: "People physically present",
            estimatedTotal: "Estimated total people",
            launch: "Launch survey",
            close: "Close survey",
            closed: "Survey closed.",
            active: "Survey active.",
            launched: "Survey launched. Waiting for responses..."
        },
        de: {
            pageTitle: "Administrator - Zoom-Umfrage",
            adminTitle: "Administrationsbereich",
            adminSubtitle: "Steuerung der Umfrage für das Meeting.",
            responses: "Antworten",
            physicalPeople: "Anwesende Personen",
            estimatedTotal: "Geschätzte Gesamtzahl der Personen",
            launch: "Umfrage starten",
            close: "Umfrage schließen",
            closed: "Umfrage geschlossen.",
            active: "Umfrage aktiv.",
            launched: "Umfrage gestartet. Warte auf Antworten..."
        },
        fr: {
            pageTitle: "Administrateur - Sondage Zoom",
            adminTitle: "Panneau d'administration",
            adminSubtitle: "Contrôle du sondage de la réunion.",
            responses: "Réponses",
            physicalPeople: "Personnes présentes physiquement",
            estimatedTotal: "Total estimé de personnes",
            launch: "Lancer le sondage",
            close: "Fermer le sondage",
            closed: "Sondage fermé.",
            active: "Sondage actif.",
            launched: "Sondage lancé. En attente des réponses..."
        },
        it: {
            pageTitle: "Amministratore - Sondaggio Zoom",
            adminTitle: "Pannello amministratore",
            adminSubtitle: "Controllo del sondaggio della riunione.",
            responses: "Risposte",
            physicalPeople: "Persone presenti fisicamente",
            estimatedTotal: "Totale stimato delle persone",
            launch: "Avvia sondaggio",
            close: "Chiudi sondaggio",
            closed: "Sondaggio chiuso.",
            active: "Sondaggio attivo.",
            launched: "Sondaggio avviato. In attesa delle risposte..."
        },
        pt: {
            pageTitle: "Administrador - Pesquisa Zoom",
            adminTitle: "Painel do administrador",
            adminSubtitle: "Controle da pesquisa da reunião.",
            responses: "Respostas",
            physicalPeople: "Pessoas presentes fisicamente",
            estimatedTotal: "Total estimado de pessoas",
            launch: "Iniciar pesquisa",
            close: "Encerrar pesquisa",
            closed: "Pesquisa encerrada.",
            active: "Pesquisa ativa.",
            launched: "Pesquisa iniciada. Aguardando respostas..."
        }
    };

    let currentState = "closed";

    function t(key) {
        return translations[idioma.value][key];
    }

    function applyLanguage() {
        document.documentElement.lang = idioma.value;
        pageTitle.textContent = t("pageTitle");
        document.querySelectorAll("[data-i18n]").forEach((element) => {
            element.textContent = t(element.dataset.i18n);
        });

        if (currentState === "active") {
            estado.textContent = t("active");
        } else if (currentState === "launched") {
            estado.textContent = t("launched");
        } else {
            estado.textContent = t("closed");
        }
    }

    idioma.addEventListener("change", applyLanguage);

    function actualizarResultados(datos) {
        respuestas.textContent = datos.totalRespuestas;
        personas.textContent = datos.totalPersonas;
        total.textContent = datos.totalPersonas;
    }

    lanzar.addEventListener("click", async () => {
    socket.emit("lanzarEncuesta");

    if (!zoomDisponible) {
        return;
    }

    try {
        await zoomSdk.startCollaborate({
            shareScreen: false
        });

        console.log("Collaborate Mode iniciado.");
    } catch (error) {
        console.error("Error al iniciar Collaborate Mode:", error);
    }
});

    cerrar.addEventListener("click", () => {
        socket.emit("cerrarEncuesta");
    });

    socket.on("estadoEncuesta", (datos) => {
        actualizarResultados(datos);
        currentState = datos.encuestaActiva ? "active" : "closed";
        applyLanguage();
    });

    socket.on("encuestaLanzada", () => {
        currentState = "launched";
        applyLanguage();
    });

    socket.on("encuestaCerrada", () => {
        currentState = "closed";
        applyLanguage();
    });

    socket.on("resultadosActualizados", actualizarResultados);
    applyLanguage();
</script>

</body>
</html>
