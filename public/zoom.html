<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Encuesta Zoom</title>

    <script src="https://appssdk.zoom.us/sdk.min.js"></script>
</head>

<body>

<p id="estado">Iniciando aplicación...</p>

<script>
async function iniciar() {

    try {

        await zoomSdk.config({
            capabilities: [
                "getRunningContext",
                "getUserContext",
                "getMeetingUUID"
            ]
        });

        const usuario = await zoomSdk.getUserContext();
        const reunion = await zoomSdk.getMeetingUUID();

        console.log("Usuario:", usuario);
        console.log("Reunión:", reunion);

        const rol = usuario.role;

        // Guardamos el identificador de la reunión
        // para que el servidor pueda separar cada reunión.
        if (reunion && reunion.meetingUUID) {

            sessionStorage.setItem(
                "meetingUUID",
                reunion.meetingUUID
            );

        }

        // Anfitrión o coanfitrión
        if (rol === "host" || rol === "coHost") {

            window.location.href = "/admin.html";

        } else {

            // Participante
            window.location.href = "/participante.html";

        }

    } catch (error) {

        console.error(
            "Error al iniciar la Zoom App:",
            error
        );

        document.getElementById("estado").textContent =
            "No se pudo iniciar la aplicación.";
    }
}

iniciar();
</script>

</body>
</html>
